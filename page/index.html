<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token 羊毛</title>
<link rel="stylesheet" href="style.css">
<script src="_magpie/bridge.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
  <div class="top">
    <div>
      <h1>Token 羊毛</h1>
      <div class="sub">看你的 magpie：哪些羊毛已能用、哪些差个插件、哪些还没插件 · 数据源 AIHOT</div>
    </div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="buckets" id="buckets"></div>
  <div class="tabhint" id="tabhint"></div>
  <div class="toolbar">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="在这一档里搜索厂商或羊毛…" autocomplete="off">
    </label>
  </div>
  <div class="panel"><div class="list" id="list"></div></div>
  <div class="empty" id="empty" style="display:none">这一档没有符合条件的羊毛</div>
  <div class="foot-note" id="footNote"></div>
  <div class="toast" id="toast"></div>
</body>
</html>
