name: Release

# 认证：npm Trusted Publishing（OIDC，免令牌）。
# 需在 npmjs.com → 包 Settings → Trusted publishing 里绑定：
#   Repository owner=sljdxde, Repository name=magpie-free-tokens, Workflow filename=release.yml

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # 必需：换取 npm 的短时发布凭证

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 故意不传 registry-url：setup-node 会写 .npmrc 里的
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，
      # 而 OIDC 场景下该变量为空，空 _authToken 会盖掉 OIDC 认证 → 401/ENEEDAUTH。
      # 不设 registry-url 时 npm 默认就走 registry.npmjs.org，只依赖 OIDC 令牌。
      - name: Setup Node (npm >= 11.5.1 for OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure recent npm
        run: npm install -g npm@latest

      - name: Setup Bun (install / tests)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "release tag = $tag"
          echo "package.json = $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag ($tag) 与 package.json 版本 ($pkg) 不一致"
            exit 1
          fi

      - name: Test
        run: bun test

      - name: Publish to npm (OIDC, no token)
        run: npm publish --access public --provenance
